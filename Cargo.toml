[workspace]
members = [
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "0.9.11"
toml_edit = "0.24.0"

# zestful: alacritty_terminal's Handler::apc_dispatch requires the zestful vte
# fork, which adds it. Pinned by REV, never by branch — a branch pin means a
# force-push silently changes what this builds. See alacritty_terminal's
# FORK_NOTES.md.
[patch.crates-io]
vte = { git = "https://github.com/zestfuldevelopment/vte", rev = "cd70a14f1eb9829472fdbd7064445846ef974500" }
